name: Release Android

# v* 태그를 올리면 Play Console 내부 테스트(internal) 트랙으로 배포한다.
# 다른 트랙은 Actions 탭에서 수동 실행(workflow_dispatch)으로 고른다.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console 트랙 (production 은 초안으로만 올라감)"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
  push:
    tags:
      - "v*"

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Upload to Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          for name in LOCAL_PROPERTIES GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 PLAY_STORE_JSON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret '$name' 이 등록되지 않았습니다. docs/CI_CD.md 참고"
              exit 1
            fi
          done
          printf '%s' "$LOCAL_PROPERTIES" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > composeApp/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_STORE_JSON_KEY" | base64 -d > "$RUNNER_TEMP/play-store.json"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "PLAY_STORE_JSON_KEY_PATH=$RUNNER_TEMP/play-store.json" >> "$GITHUB_ENV"

      - name: Build & Upload
        env:
          TRACK: ${{ inputs.track || 'internal' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android deploy track:"$TRACK"

      - name: Upload AAB & mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/bundle/release/*.aab
            composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
