name: Release Android

# develop 에 코드가 올라오면 Play Console 내부 테스트(internal) 트랙으로,
# master 에 올라오면 프로덕션 트랙(전체 출시)으로 배포한다.
on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "iosApp/**"
      - "fastlane/metadata/ios/**"
      - ".github/workflows/release-ios.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console 트랙"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

concurrency:
  group: release-android-${{ github.ref_name }}
  # develop 은 연달아 푸시되면 이전 빌드를 취소하고 최신 커밋만 올린다. master(프로덕션)는 끝까지 돌린다.
  cancel-in-progress: ${{ github.ref_name == 'develop' }}

jobs:
  deploy:
    name: Build & Upload to Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          for name in LOCAL_PROPERTIES GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 PLAY_STORE_JSON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret '$name' 이 등록되지 않았습니다. docs/CI_CD.md 참고"
              exit 1
            fi
          done
          printf '%s' "$LOCAL_PROPERTIES" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > composeApp/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_STORE_JSON_KEY" | base64 -d > "$RUNNER_TEMP/play-store.json"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "PLAY_STORE_JSON_KEY_PATH=$RUNNER_TEMP/play-store.json" >> "$GITHUB_ENV"

      - name: Build & Upload
        env:
          # 수동 실행은 고른 트랙, master 푸시는 production, 그 외(develop)는 internal
          TRACK: ${{ inputs.track || (github.ref_name == 'master' && 'production') || 'internal' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android deploy track:"$TRACK"

      - name: Upload AAB & mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/bundle/release/*.aab
            composeApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
