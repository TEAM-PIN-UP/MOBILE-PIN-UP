#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.parallel=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Android 16(API 36) 타겟팅 — 현재 AGP(8.6.0) tested 범위(35)를 넘는 compileSdk 사용을 의도적으로 허용
android.suppressUnsupportedCompileSdk=36

#iOS
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true
#kotlin.native.cacheKind.iosSimulatorArm64=none
#kotlin.apple.bundleId=com.pinup.pinup.PinUp
